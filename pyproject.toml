[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featureforge"
version = "1.0.0"
description = "Automated, leak-free feature engineering for tabular data: related tables, structure-triggered blocks and a gated feature search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Ionuț" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "pyarrow>=14",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
chem = ["rdkit"]
dev = ["pytest>=8", "pyflakes"]

[project.scripts]
featureforge = "featureforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
